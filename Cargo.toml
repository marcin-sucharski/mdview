[package]
name = "mdview"
version = "0.1.14"
edition = "2021"
rust-version = "1.91"
description = "Terminal and web Markdown previewers with live reload"
repository = "https://github.com/marcin-sucharski/mdview"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
notify = { version = "8.2.2", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

[[bin]]
name = "mdview"
path = "src/main.rs"

[[bin]]
name = "mdview-web"
path = "src/bin/mdview-web.rs"
